<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장유승의 학습 퀴즈</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="quiz-container">
    <!-- 상단 타이틀 박스 (반석초 로고 포함) -->
    <div class="quiz-title-box">
      <img src="logo_banseok.jpg" alt="반석초등학교 로고" class="school-logo" />
      <h1>장유승의 학습 퀴즈</h1>
    </div>
    <div id="loading" class="status-msg">문제를 불러오는 중...</div>

    <!-- 퀴즈 영역 -->
    <div id="quiz-box" class="hidden">
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div class="quiz-header">
        <span id="question-count">문제 1/8</span>
        <span id="score-counter">점수: 0</span>
      </div>

      <h2 id="question-text">문제 내용이 여기에 표시됩니다.</h2>

      <!-- 문제 이미지 영역 -->
      <div id="question-image-container" class="image-box hidden">
        <img id="question-image" src="" alt="문제 이미지" />
      </div>

      <div id="options-container" class="options-list">
        <!-- 보기 버튼 -->
      </div>

      <div id="explanation-box" class="explanation hidden">
        <p id="explanation-text"></p>
        <button id="next-btn">다음 문제</button>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-box" class="hidden">
      <h2>🎉 퀴즈 완료!</h2>
      <p id="final-score">총 8문제 중 8문제를 맞혔습니다.</p>
      <button id="restart-btn">다시 풀기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
